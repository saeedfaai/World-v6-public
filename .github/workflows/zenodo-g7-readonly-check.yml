name: Zenodo G7 read-only check

on:
  push:
    branches: [main]
    paths:
      - .zenodo-g7-readonly-trigger
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read Zenodo draft only
        shell: bash
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, requests
          token=os.environ.get('ZENODO_TOKEN','')
          dep_id='22040348'
          out='/tmp/zenodo-readonly.md'
          lines=['Zenodo G7 read-only draft check (no writes, no publish, no token exposed).','']
          if not token:
              lines += ['- Result: `MISSING_SECRET`']
              open(out,'w').write('\n'.join(lines)); raise SystemExit(0)
          h={'Authorization':f'Bearer {token}','Accept':'application/json'}
          legacy=requests.get(f'https://zenodo.org/api/deposit/depositions/{dep_id}',headers=h,timeout=30)
          modern=requests.get(f'https://zenodo.org/api/records/{dep_id}/draft',headers=h,timeout=30)
          lines += [f'- Legacy HTTP: `{legacy.status_code}`', f'- Modern HTTP: `{modern.status_code}`']
          if not (legacy.ok and modern.ok):
              lines += ['- Result: `READ_FAILED`']
              open(out,'w').write('\n'.join(lines)); raise SystemExit(0)
          lj=legacy.json(); mj=modern.json()
          lmd=lj.get('metadata') or {}; mmd=mj.get('metadata') or {}
          def find_paths(obj, needle, path='$'):
              hits=[]
              if isinstance(obj, dict):
                  for k,v in obj.items(): hits += find_paths(v, needle, path+'.'+str(k))
              elif isinstance(obj, list):
                  for i,v in enumerate(obj): hits += find_paths(v, needle, path+f'[{i}]')
              elif isinstance(obj, str) and needle.lower() in obj.lower():
                  hits.append(path)
              return hits
          blob={'legacy':lj,'modern':mj}
          poly_hits=[]
          cc_hits=[]
          for term in ['polyform-noncommercial-1.0.0','PolyForm Noncommercial']:
              poly_hits += find_paths(blob, term)
          for term in ['cc-by-nc-sa-4.0','Attribution-NonCommercial-ShareAlike 4.0','by-nc-sa/4.0']:
              cc_hits += find_paths(blob, term)
          files=[]
          for f in lj.get('files') or []:
              files.append({'name':f.get('filename') or f.get('key'),'size':f.get('filesize') or f.get('size'),'checksum':f.get('checksum')})
          exact_file=any(f.get('name')=='World_v6.2_RC3_FINAL_RELEASE.zip' and int(f.get('size') or 0)==8005594 for f in files)
          core=(lmd.get('title')=='World v6.2 — Fractal Multi-Brain Architecture' and lmd.get('upload_type')=='software' and lmd.get('version')=='6.2.0-rc.3' and bool(lmd.get('creators')))
          lines += [
              f'- Draft id: `{dep_id}`',
              f'- Submitted: `{lj.get("submitted")}`',
              f'- State: `{lj.get("state")}`',
              f'- Title: `{lmd.get("title")}`',
              f'- Type: `{lmd.get("upload_type")}`',
              f'- Version: `{lmd.get("version")}`',
              f'- Legacy license: `{lmd.get("license")}`',
              f'- Modern rights: `{json.dumps(mmd.get("rights"), ensure_ascii=False)}`',
              f'- Modern license: `{json.dumps(mmd.get("license"), ensure_ascii=False)}`',
              f'- PolyForm detected anywhere: `{bool(poly_hits)}`',
              f'- CC BY-NC-SA 4.0 detected anywhere: `{bool(cc_hits)}`',
              f'- PolyForm paths: `{sorted(set(poly_hits))}`',
              f'- CC paths: `{sorted(set(cc_hits))}`',
              f'- Core metadata valid: `{core}`',
              f'- Exact file valid: `{exact_file}`',
              f'- Files: `{json.dumps(files, ensure_ascii=False)}`',
              '- Result: `OK`' if core and exact_file else '- Result: `METADATA_OR_FILE_PROBLEM`'
          ]
          open(out,'w').write('\n'.join(lines))
          PY

      - name: Report read-only result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Zenodo G7 read-only check - ${GITHUB_RUN_ID}" --body-file /tmp/zenodo-readonly.md
