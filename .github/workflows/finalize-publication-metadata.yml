name: Finalize World v6 publication metadata

on:
  push:
    branches: [main]
    paths:
      - .finalize-publication-metadata-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch README and publication gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('README.md')
          s=p.read_text()
          old='**Repository:** `saeedfaai/world-v6`'
          new='**Repository:** `saeedfaai/World-v6-public`'
          if old not in s: raise SystemExit('README repository marker not found')
          s=s.replace(old,new,1)
          old2='Use [`CITATION.cff`](CITATION.cff). A version DOI will be added after the first cleared\npublic GitHub pre-release is archived through Zenodo.'
          new2='Use [`CITATION.cff`](CITATION.cff). The archived RC3 version DOI is **`10.5281/zenodo.22040348`** (concept DOI: **`10.5281/zenodo.22040347`**). The public Zenodo record is `https://zenodo.org/records/22040348`.'
          if old2 not in s: raise SystemExit('README citation marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('PUBLICATION_GATES.md')
          s=p.read_text()
          s=s.replace('**Status: FINAL CI REQUIRED ON EXACT PUBLICATION COMMIT**','**Status: PASS — final CI succeeded on the exact publication commit.**',1)
          old6='''- [ ] Create a new clean public repository/snapshot with no legacy development history.\n- [ ] Import only the exact approved publication payload.\n- [ ] Tag `v6.2.0-rc.3` on the exact imported snapshot.\n- [ ] Create a GitHub **Pre-release** titled `World v6.2 Fractal Multi-Brain Architecture — RC3`.\n- [ ] Attach the deterministic source ZIP, generated hashes/inventory, manifest, SBOM and cleared architecture PDFs.\n- [ ] State prominently: `NON-COMMERCIAL`, `NOT CANONICAL`, `NOT DEPLOYED`, `E2`.\n- [ ] Keep `saeedfaai/world-v6` private unless its full legacy history is separately cleared and intentionally published.\n\n**Status: READY AFTER FINAL G4 CI; PUBLIC-REPOSITORY CREATION STILL REQUIRED**'''
          new6='''- [x] Created clean public repository `saeedfaai/World-v6-public` with no legacy development history.\n- [x] Imported only the exact approved publication payload.\n- [x] Tagged `v6.2.0-rc.3` on exact snapshot `f918ae13aaee072b2107ec6532bc8c290be3e70a`.\n- [x] Created GitHub **Pre-release** titled `World v6.2 Fractal Multi-Brain Architecture — RC3`.\n- [x] Published the exact release artifact set; release ZIP SHA-256: `44c47e7d37ba7f6d34a8439ee0917b5b328c23cfbdb53b4cb917402e5869ea4b`.\n- [x] Publication states `NON-COMMERCIAL`, `NOT CANONICAL`, `NOT DEPLOYED`, `E2`.\n- [x] Historical `saeedfaai/world-v6` remains private.\n\n**Status: PASS**'''
          if old6 not in s: raise SystemExit('G6 marker not found')
          s=s.replace(old6,new6,1)
          old7='''- [ ] Enable/confirm Zenodo integration for the clean public repository.\n- [ ] Archive the public pre-release.\n- [ ] Record the version DOI.\n- [ ] Add the DOI to citation metadata and future release records.\n\n**Status: PENDING PUBLIC RELEASE**'''
          new7='''- [x] Archived the exact RC3 release package on Zenodo.\n- [x] Zenodo record published with `submitted=true` and `state=done`.\n- [x] Version DOI recorded: `10.5281/zenodo.22040348`.\n- [x] Concept DOI recorded: `10.5281/zenodo.22040347`.\n- [x] DOI added to citation/publication metadata on `main`.\n\nZenodo record: `https://zenodo.org/records/22040348`\n\n**Status: PASS**'''
          if old7 not in s: raise SystemExit('G7 marker not found')
          s=s.replace(old7,new7,1)
          old_tail='Once the exact-commit CI is green, the payload is technically ready for creation of that clean public repository and pre-release.'
          new_tail='The clean public repository, GitHub pre-release, Zenodo archive and DOI are complete. G0–G7 are closed for `v6.2.0-rc.3`; the historical development repository remains private.'
          if old_tail not in s: raise SystemExit('Gate tail marker not found')
          s=s.replace(old_tail,new_tail,1)
          p.write_text(s)
          PY
      - name: Commit final publication metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md PUBLICATION_GATES.md
          git diff --cached --quiet && exit 0
          git commit -m "Finalize DOI publication metadata"
          git push origin HEAD:main
