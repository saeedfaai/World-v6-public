name: W8-P01 Public Review Package v0.1

on:
  push:
    branches:
      - w8-p01-review-package-v0.1
    paths:
      - 'world8/w8-p01-review-package-v0.1/**'
      - '.github/workflows/w8-p01-public-review-package-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reproduce E1 hardened-baseline mechanism experiment
        working-directory: world8/w8-p01-review-package-v0.1/reference
        run: python run_experiment_v2.py --trials 1000 --seed 20260827 --output ../results_e1

      - name: Reproduce E2 two-Society conformance
        working-directory: world8/w8-p01-review-package-v0.1/reference
        run: python society_conformance.py --trials 1000 --seed 20260827 --output ../results_society

      - name: Reproduce E4 mutation gate
        working-directory: world8/w8-p01-review-package-v0.1/reference
        run: python mutation_gate_v1.py --trials 500 --seed 20260827 --output ../results_mutation

      - name: Reproduce E4 compound-fault gate
        working-directory: world8/w8-p01-review-package-v0.1/reference
        run: python compound_fault_gate_v1.py --trials 1000 --seed 20260827 --output ../results_compound

      - name: Validate frozen bounded outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('world8/w8-p01-review-package-v0.1')

          # E1: exact frozen experiment shape and selected bounded outcomes.
          e1 = json.loads((root/'results_e1'/'summary_v2.json').read_text())
          assert e1['seed'] == 20260827
          assert e1['trials_per_scenario_per_system'] == 1000
          assert e1['total_trials'] == 98000
          w8 = e1['systems']['world8_full']['by_scenario']
          hb = e1['systems']['hardened_session_baseline']['by_scenario']

          # Valid-path reference cost; this is a check/evidence-record count, not latency.
          assert w8['F0']['valid_effect_success_rate'] == 1.0
          assert w8['F0']['mean_policy_checks'] == 7.0
          assert w8['F0']['mean_evidence_records'] == 9.0
          assert hb['F0']['valid_effect_success_rate'] == 1.0
          assert hb['F0']['mean_policy_checks'] == 6.0
          assert hb['F0']['mean_evidence_records'] == 8.0

          # Hardened generic controls intentionally erase generic advantages.
          assert hb['F3']['fail_closed_rate_on_invalid_attempts'] == 1.0  # revoke
          assert hb['F4']['fail_closed_rate_on_invalid_attempts'] == 1.0  # CAS/stale write
          assert hb['F5']['fail_closed_rate_on_invalid_attempts'] == 1.0  # durable idempotency
          assert hb['C1_REVOKE_RACE']['fail_closed_rate_on_invalid_attempts'] == 1.0
          assert hb['C2_SESSION_SWAP_STALE_RETRY']['fail_closed_rate_on_invalid_attempts'] == 1.0

          # Differentiated frozen failure families.
          assert w8['F2']['unauthorized_effect_rate'] == 0.0
          assert hb['F2']['unauthorized_effect_rate'] == 1.0
          assert w8['F7']['unauthorized_effect_rate'] == 0.0
          assert hb['F7']['unauthorized_effect_rate'] == 1.0
          assert w8['F9']['audit_correct_rate'] == 1.0
          assert hb['F9']['audit_correct_rate'] == 0.0
          assert w8['F10']['actor_continuity_rate'] == 1.0
          assert hb['F10']['actor_continuity_rate'] == 0.0
          assert w8['C3_RESTART_TAMPER']['audit_correct_rate'] == 1.0
          assert hb['C3_RESTART_TAMPER']['audit_correct_rate'] == 0.0

          # E2 cross-Society conformance.
          s = json.loads((root/'results_society'/'society_conformance.json').read_text())
          assert s['trials_per_society'] == 1000
          assert s['all_company_pass'] is True
          assert s['all_trading_pass'] is True
          assert s['conformance_vectors_equal'] is True
          assert s['market_performance_evaluated'] is False
          assert s['live_effects'] is False

          # E4 mutation gate.
          m = json.loads((root/'results_mutation'/'mutation_gate_v1.json').read_text())
          assert m['gate_state'] == 'PASS'
          assert m['killed'] == 5
          assert m['total'] == 5
          assert m['mutation_score'] == 1.0
          assert m['runtime_db_mutated'] is False

          # E4 compound-fault gate.
          c = json.loads((root/'results_compound'/'compound_fault_gate_v1.json').read_text())
          assert c['gate_state'] == 'PASS'
          assert c['trials_per_case'] == 1000
          assert c['runtime_db_mutated'] is False
          assert all(v == 0.0 for v in c['world8_false_deny_rate_valid_paths'].values())
          for name, rates in c['rates'].items():
              if name.startswith('CF'):
                  assert rates['world8_safe'] == 1.0
                  assert rates['baseline_failure_exposed'] == 1.0

          print('W8-P01 PUBLIC REVIEW PACKAGE: FROZEN E1/E2/E4 OUTCOMES REPRODUCED')
          PY

      - name: Hash public source and reproduced evidence
        run: |
          cd world8/w8-p01-review-package-v0.1
          sha256sum \
            reference/model.py \
            reference/model_v2.py \
            reference/run_experiment_v2.py \
            reference/society_conformance.py \
            reference/mutation_gate_v1.py \
            reference/compound_fault_gate_v1.py \
            results_e1/summary_v2.json \
            results_society/society_conformance.json \
            results_mutation/mutation_gate_v1.json \
            results_compound/compound_fault_gate_v1.json \
            | tee PUBLIC_SHA256SUMS.txt

      - name: Upload public reproduction receipt
        uses: actions/upload-artifact@v4
        with:
          name: w8-p01-public-review-package-v0.1
          path: |
            world8/w8-p01-review-package-v0.1/results_e1/summary_v2.json
            world8/w8-p01-review-package-v0.1/results_society/
            world8/w8-p01-review-package-v0.1/results_mutation/
            world8/w8-p01-review-package-v0.1/results_compound/
            world8/w8-p01-review-package-v0.1/PUBLIC_SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error
