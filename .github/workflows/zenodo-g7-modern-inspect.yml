name: Inspect Zenodo modern draft schema

on:
  push:
    branches: [main]
    paths:
      - .zenodo-g7-modern-trigger
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  inspect-modern:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect modern endpoints
        shell: bash
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, requests
          token=os.environ['ZENODO_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/json'}
          recid='22040348'
          urls=[
            f'https://zenodo.org/api/user/records/{recid}',
            f'https://zenodo.org/api/user/records/{recid}/draft',
            f'https://zenodo.org/api/records/{recid}/draft',
          ]
          lines=['Zenodo modern draft schema inspection (sanitized).','']
          for u in urls:
              r=requests.get(u,headers=h,timeout=30)
              lines.append(f'- `{u.replace("https://zenodo.org","")}` -> HTTP `{r.status_code}`')
              if r.ok:
                  try:
                      j=r.json(); md=j.get('metadata') or {}
                      lines += [
                        f"  - top keys: `{sorted(j.keys())}`",
                        f"  - metadata keys: `{sorted(md.keys())}`",
                        f"  - resource_type: `{json.dumps(md.get('resource_type'), ensure_ascii=False)}`",
                        f"  - title: `{md.get('title')}`",
                        f"  - publication_date: `{md.get('publication_date')}`",
                        f"  - creators: `{json.dumps(md.get('creators'), ensure_ascii=False)}`",
                        f"  - rights: `{json.dumps(md.get('rights'), ensure_ascii=False)}`",
                        f"  - access: `{json.dumps(j.get('access'), ensure_ascii=False)}`",
                      ]
                  except Exception as e:
                      lines.append(f'  - JSON parse error: `{type(e).__name__}`')
          open('/tmp/modern.md','w').write('\n'.join(lines))
          PY
      - name: Report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Zenodo modern schema inspection - ${GITHUB_RUN_ID}" --body-file /tmp/modern.md
