name: Stage verified World v6.2 RC3 snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: world-v6-rc3-import
  cancel-in-progress: true

jobs:
  stage-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact release ZIP
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f World_v6.2_RC3_FINAL_RELEASE.zip
          echo "44c47e7d37ba7f6d34a8439ee0917b5b328c23cfbdb53b4cb917402e5869ea4b  World_v6.2_RC3_FINAL_RELEASE.zip" | sha256sum -c -
          cp World_v6.2_RC3_FINAL_RELEASE.zip /tmp/World_v6.2_RC3_FINAL_RELEASE.zip

      - name: Extract and validate clean payload
        id: extract
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/world-v6-rc3
          mkdir -p /tmp/world-v6-rc3
          unzip -q /tmp/World_v6.2_RC3_FINAL_RELEASE.zip -d /tmp/world-v6-rc3
          ROOT=/tmp/world-v6-rc3/World_v6.2_Fractal_Multi_Brain_RC3
          test -d "$ROOT"
          COUNT="$(find "$ROOT" -type f | wc -l | tr -d ' ')"
          echo "payload_count=$COUNT"
          test "$COUNT" = "207"
          for f in README.md LICENSE RELEASE_MANIFEST.json SBOM.cdx.json FILE_INVENTORY.txt SHA256SUMS.txt .github/workflows/verify.yml; do
            test -f "$ROOT/$f"
          done

      - name: Stage snapshot while preserving current workflow
        id: import
        if: steps.verify.outcome == 'success' && steps.extract.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/world-v6-rc3/World_v6.2_Fractal_Multi_Brain_RC3
          mkdir -p /tmp/bootstrap-workflows
          cp -a .github/workflows/. /tmp/bootstrap-workflows/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$ROOT"/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/bootstrap-workflows/. .github/workflows/
          git config user.name "World v6 Publication Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f FILE_INVENTORY.txt SHA256SUMS.txt
          TRACKED="$(git ls-files | wc -l | tr -d ' ')"
          echo "staged_tracked_count=$TRACKED"
          test "$TRACKED" = "207"
          git commit -m "Stage World v6.2.0-rc.3 clean snapshot"
          git push origin HEAD:main

      - name: Report staging failure
        if: always() && (steps.verify.outcome != 'success' || steps.extract.outcome != 'success' || steps.import.outcome != 'success')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY: ${{ steps.verify.outcome }}
          EXTRACT: ${{ steps.extract.outcome }}
          IMPORT: ${{ steps.import.outcome }}
        run: |
          cat >/tmp/diag.md <<EOF
          Automated RC3 staging diagnostic.

          Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}

          - verify: ${VERIFY}
          - extract: ${EXTRACT}
          - import: ${IMPORT}
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "RC3 staging diagnostic - run ${GITHUB_RUN_ID}" --body-file /tmp/diag.md
          exit 1
