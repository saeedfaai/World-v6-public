name: Publish World 7 v0.2 RC1 to Zenodo

on:
  push:
    branches:
      - release/world7-v0.2-rc1
    paths:
      - world7/ZENODO_TRIGGER_v7.0.0-rc.1.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/release/world7-v0.2-rc1' && !contains(github.event.head_commit.message, '[zenodo-marker]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out World 7 release branch
        uses: actions/checkout@v4
        with:
          ref: release/world7-v0.2-rc1

      - name: Build exact Zenodo payload
        shell: bash
        run: |
          rm -rf zenodo-payload
          mkdir -p zenodo-payload
          cp .zenodo.json zenodo-payload/
          cp CITATION.cff zenodo-payload/
          cp WORLD7_RELEASE_NOTES_v0.2.md zenodo-payload/
          cp -R world7 zenodo-payload/world7
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('zenodo-payload')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
          (cd zenodo-payload && zip -r ../World_7_v0.2_RC1_Zenodo_Snapshot.zip .)
          sha256sum World_7_v0.2_RC1_Zenodo_Snapshot.zip > World_7_v0.2_RC1_Zenodo_Snapshot.zip.sha256

      - name: Create/reuse Zenodo deposit and publish
        shell: bash
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, pathlib, requests, hashlib, datetime

          token=os.environ.get('ZENODO_TOKEN','')
          out=pathlib.Path('/tmp/zenodo-world7-result.json')
          title='World 7 v0.2 — Living Genome Architecture for Persistent Digital Organisms'
          version='7.0.0-rc.1'
          zip_name='World_7_v0.2_RC1_Zenodo_Snapshot.zip'
          sha_name=zip_name+'.sha256'
          result={
              'release':'World 7 v0.2 RC1',
              'title':title,
              'version':version,
              'status':'UNKNOWN',
              'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          if not token:
              result['status']='MISSING_ZENODO_TOKEN'
              out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
              raise SystemExit(1)

          h={'Authorization':f'Bearer {token}','Accept':'application/json'}
          jh={**h,'Content-Type':'application/json'}

          # Idempotency: reuse an existing World 7 v0.2 deposit if one already exists.
          listing=requests.get('https://zenodo.org/api/deposit/depositions',headers=h,params={'size':100,'sort':'mostrecent'},timeout=60)
          result['list_http']=listing.status_code
          if not listing.ok:
              result['status']='LIST_DEPOSITS_FAILED'
              result['body']=listing.text[:1000]
              out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
              raise SystemExit(1)
          items=listing.json()
          if isinstance(items,dict):
              items=items.get('hits',{}).get('hits',[]) or items.get('items',[]) or []
          existing=None
          for d in items or []:
              md=d.get('metadata') or {}
              if md.get('title')==title and md.get('version')==version:
                  existing=d; break

          if existing:
              dep=existing
              dep_id=str(dep.get('id') or dep.get('recid'))
              result['deposit_reused']=True
          else:
              c=requests.post('https://zenodo.org/api/deposit/depositions',headers=jh,data='{}',timeout=60)
              result['create_http']=c.status_code
              if not c.ok:
                  result['status']='CREATE_DEPOSIT_FAILED'
                  result['body']=c.text[:1000]
                  out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
                  raise SystemExit(1)
              dep=c.json(); dep_id=str(dep.get('id') or dep.get('recid'))
              result['deposit_reused']=False

          result['record_id']=dep_id
          if dep.get('submitted'):
              doi=dep.get('doi') or (dep.get('metadata') or {}).get('doi') or ((dep.get('metadata') or {}).get('prereserve_doi') or {}).get('doi')
              result.update({'status':'ALREADY_PUBLISHED','doi':doi,'record_url':f'https://zenodo.org/records/{dep_id}'})
              out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
              raise SystemExit(0)

          # Resolve PolyForm Noncommercial license from Zenodo registry.
          lic_id=None
          for query in ['PolyForm-Noncommercial-1.0.0','PolyForm Noncommercial License 1.0.0','PolyForm Noncommercial']:
              lr=requests.get('https://zenodo.org/api/licenses/',params={'q':query,'size':100},timeout=30)
              if not lr.ok: continue
              data=lr.json()
              lis=data.get('hits',{}).get('hits',[]) if isinstance(data,dict) else data
              for item in lis or []:
                  mdx=item.get('metadata') or item
                  iid=(mdx.get('id') or item.get('id') or '')
                  ititle=(mdx.get('title') or item.get('title') or '')
                  if 'polyform' in (iid+' '+ititle).lower() and 'noncommercial' in (iid+' '+ititle).lower():
                      lic_id=iid; break
              if lic_id: break
          if not lic_id:
              result['status']='LICENSE_NOT_FOUND'
              out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
              raise SystemExit(1)
          result['license_id']=lic_id

          # Ensure files are uploaded once.
          current=requests.get(f'https://zenodo.org/api/deposit/depositions/{dep_id}',headers=h,timeout=60)
          if not current.ok:
              result['status']='READ_DEPOSIT_FAILED'
              result['read_http']=current.status_code
              out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
              raise SystemExit(1)
          dep=current.json()
          existing_names={(f.get('filename') or f.get('key')) for f in (dep.get('files') or [])}
          bucket=(dep.get('links') or {}).get('bucket')
          if not bucket:
              result['status']='NO_BUCKET_URL'
              out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
              raise SystemExit(1)
          for fname in [zip_name, sha_name]:
              if fname in existing_names:
                  continue
              with open(fname,'rb') as fh:
                  up=requests.put(f'{bucket}/{fname}',data=fh,headers=h,timeout=180)
              if not up.ok:
                  result['status']='UPLOAD_FAILED'
                  result['upload_file']=fname
                  result['upload_http']=up.status_code
                  result['body']=up.text[:1000]
                  out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
                  raise SystemExit(1)

          metadata={
            'upload_type':'software',
            'publication_date':'2026-08-22',
            'title':title,
            'creators':[{'name':'Farokhi, Saeed'}],
            'description':(
              '<p>World 7 is a ratification-candidate genomic runtime architecture for persistent digital organisms. '
              'It separates identity, canonical state, memory, authority, lineage, development, genesis, repair, reconstruction and evolution '
              'from replaceable AI models and providers.</p>'
              '<p>The v0.2 candidate defines a 19-domain Universal Genome, governed inheritance and birth gates, RoleBinding-based authority, '
              'a deterministic proposal-to-commit Spine with CAS/idempotency/hash chaining, Pulse/Tempo/Resolution controls, and an evidence-driven G0→G10 roadmap beginning with secretary-001.</p>'
              '<p>Evidence boundary: 2048 proof obligations are registered; 4096/4096 bounded local model assertions and 18/18 seed reference tests pass. '
              'Live shared ChatGPT/Grok canonical state, PostgreSQL atomicity, clean-host restore, security/load/chaos and production readiness remain open.</p>'
              '<p>This is a PUBLIC / SOURCE-AVAILABLE / NON-COMMERCIAL release. Original software is under PolyForm Noncommercial 1.0.0; '
              'original documentation/architecture is under CC BY-NC-SA 4.0. Commercial use requires a separate written license from Saeed Farokhi.</p>'
            ),
            'access_right':'open',
            'license':lic_id,
            'version':version,
            'keywords':['persistent digital organisms','genomic runtime','AI agents','multi-agent systems','multi-model AI','agent governance','event sourcing','hash chain','AI memory','evidence-driven architecture','non-extinction architecture'],
            'notes':(
              'Status: RATIFICATION_CANDIDATE / GENESIS_STARTED_CANDIDATE / NON-CANONICAL / NOT DEPLOYED / NOT PRODUCTION. '
              'Mixed-license release: software PolyForm Noncommercial 1.0.0; documentation/architecture CC BY-NC-SA 4.0. '
              'Previous World v6.2 version DOI: 10.5281/zenodo.22040348; concept DOI: 10.5281/zenodo.22040347.'
            ),
            'related_identifiers':[
              {'identifier':'https://github.com/saeedfaai/World-v6-public','relation':'isSupplementTo','scheme':'url'},
              {'identifier':'https://github.com/saeedfaai/World-v6-public/releases/tag/v7.0.0-rc.1','relation':'isSupplementTo','scheme':'url'},
              {'identifier':'10.5281/zenodo.22040348','relation':'isNewVersionOf','scheme':'doi'}
            ]
          }
          u=requests.put(f'https://zenodo.org/api/deposit/depositions/{dep_id}',headers=jh,data=json.dumps({'metadata':metadata}),timeout=60)
          result['metadata_http']=u.status_code
          if not u.ok:
              result['status']='METADATA_UPDATE_FAILED'
              result['body']=u.text[:1500]
              out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
              raise SystemExit(1)

          p=requests.post(f'https://zenodo.org/api/deposit/depositions/{dep_id}/actions/publish',headers=h,timeout=120)
          result['publish_http']=p.status_code
          if not p.ok:
              result['status']='PUBLISH_FAILED'
              result['body']=p.text[:1500]
              out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
              raise SystemExit(1)
          pj=p.json()
          doi=pj.get('doi') or (pj.get('metadata') or {}).get('doi') or ((pj.get('metadata') or {}).get('prereserve_doi') or {}).get('doi')
          concept=((pj.get('metadata') or {}).get('relations') or {}).get('version',{}).get('parent',{}).get('pid_value')
          result.update({
              'status':'PUBLISHED',
              'doi':doi,
              'concept_doi':concept,
              'record_url':f'https://zenodo.org/records/{dep_id}',
              'zip_sha256':hashlib.sha256(pathlib.Path(zip_name).read_bytes()).hexdigest()
          })
          out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Write durable Zenodo receipt
        if: always()
        shell: bash
        run: |
          if [ ! -s /tmp/zenodo-world7-result.json ]; then
            echo '{"status":"WORKFLOW_FAILED_BEFORE_RECEIPT"}' > /tmp/zenodo-world7-result.json
          fi
          cp /tmp/zenodo-world7-result.json world7/ZENODO_PUBLISHED_v7.0.0-rc.1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world7/ZENODO_PUBLISHED_v7.0.0-rc.1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[zenodo-marker] Record World 7 Zenodo publication receipt"
          git push origin HEAD:release/world7-v0.2-rc1
