name: Patch commercial banner into README

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch README files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          marker='**Repository:** `saeedfaai/World-v6-public`\n'
          block='''\n## Commercial licensing & partnerships — proposals welcome\n\nWorld v6.2 is open to **commercial licensing, paid enterprise deployment, OEM/embedded licensing, royalty or revenue-share arrangements, strategic partnerships, and joint ventures**. Concrete financial proposals are welcome.\n\nThe public release does **not** grant commercial rights. Commercial use requires a separate written agreement with **Saeed Farokhi**.\n\n**[Commercial options & proposal guidance](COMMERCIAL.md)** · **[Open a commercial inquiry](https://github.com/saeedfaai/World-v6-public/issues/new?template=commercial-inquiry.yml)**\n\n> GitHub Issues are public. Do not post confidential deal terms or private business information; use the inquiry only to establish a private negotiation channel.\n'''
          if '## Commercial licensing & partnerships — proposals welcome' not in s:
              if marker not in s: raise SystemExit('README marker not found')
              p.write_text(s.replace(marker, marker+block, 1), encoding='utf-8')

          p=Path('README_FA.md')
          s=p.read_text(encoding='utf-8')
          marker='`RATIFICATION_CANDIDATE_NOT_CANONICAL_NOT_DEPLOYED`\n'
          block='''\n\n## همکاری تجاری و پیشنهاد مالی\n\nWorld v6.2 برای **پیشنهادهای تجاری و مالی** باز است؛ از جمله خرید لایسنس تجاری، اجرای Enterprise، OEM/White-label، سهم از درآمد یا Royalty، شراکت راهبردی و Joint Venture. پیشنهادهای دارای ساختار مالی مشخص در اولویت بررسی هستند.\n\nانتشار عمومی این مخزن هیچ حق استفادهٔ تجاری ایجاد نمی‌کند. هر استفادهٔ تجاری نیازمند **قرارداد کتبی جداگانه با Saeed Farokhi** است.\n\n**[مدل‌های همکاری و راهنمای پیشنهاد تجاری](COMMERCIAL.md)** · **[ارسال Commercial Inquiry](https://github.com/saeedfaai/World-v6-public/issues/new?template=commercial-inquiry.yml)**\n\n> Issueهای GitHub عمومی‌اند؛ اطلاعات محرمانه یا جزئیات خصوصی معامله را در Issue ننویسید. Issue فقط برای شروع ارتباط و انتقال مذاکره به کانال خصوصی است.\n'''
          if '## همکاری تجاری و پیشنهاد مالی' not in s:
              if marker not in s: raise SystemExit('README_FA marker not found')
              p.write_text(s.replace(marker, marker+block, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_FA.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote commercial licensing and partnership inquiries"
          git push
