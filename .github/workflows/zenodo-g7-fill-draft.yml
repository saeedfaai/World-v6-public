name: Fill Zenodo G7 draft metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .zenodo-g7-trigger

permissions:
  contents: read

jobs:
  fill-zenodo-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Fill and validate Zenodo draft
        shell: bash
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ZENODO_TOKEN:-}" || { echo "ERROR: GitHub secret ZENODO_TOKEN is missing"; exit 2; }
          python - <<'PY'
          import os, sys, json, requests

          TOKEN = os.environ['ZENODO_TOKEN']
          BASE = 'https://zenodo.org/api'
          TARGET_FILE = 'World_v6.2_RC3_FINAL_RELEASE.zip'
          TARGET_TITLE = 'World v6.2 — Fractal Multi-Brain Architecture'
          headers = {
              'Authorization': f'Bearer {TOKEN}',
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          }

          def fail(msg, response=None):
              print('ERROR:', msg)
              if response is not None:
                  print('HTTP:', response.status_code)
                  try:
                      body = response.json()
                      if isinstance(body, dict):
                          if 'message' in body:
                              print('MESSAGE:', body.get('message'))
                          if 'errors' in body:
                              print('VALIDATION_ERRORS:', json.dumps(body.get('errors'), ensure_ascii=False))
                  except Exception:
                      print('BODY:', response.text[:1500])
              sys.exit(1)

          r = requests.get(
              f'{BASE}/deposit/depositions',
              params={'status': 'draft', 'sort': '-mostrecent', 'size': 100},
              headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/json'},
              timeout=30,
          )
          if not r.ok:
              fail('Could not list Zenodo drafts', r)
          drafts = r.json()
          if isinstance(drafts, dict):
              drafts = drafts.get('hits', {}).get('hits', []) or drafts.get('entries', []) or []

          def filenames(dep):
              out=[]
              for f in dep.get('files') or []:
                  out.append(f.get('filename') or f.get('key') or '')
              return out

          candidates = [d for d in drafts if TARGET_FILE in filenames(d)]
          if not candidates:
              candidates = [d for d in drafts if 'World v6.2' in (d.get('title') or d.get('metadata', {}).get('title') or '')]
          if not candidates:
              fail('No matching World v6.2 RC3 draft found in this Zenodo account')
          dep = candidates[0]
          dep_id = dep.get('id')
          if not dep_id:
              fail('Matched draft has no deposition id')

          r = requests.get(
              f'{BASE}/deposit/depositions/{dep_id}',
              headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/json'},
              timeout=30,
          )
          if not r.ok:
              fail('Could not read matched Zenodo draft', r)
          dep = r.json()
          md = dict(dep.get('metadata') or {})

          md['upload_type'] = 'software'
          md['publication_date'] = '2026-08-21'
          md['title'] = TARGET_TITLE
          md['creators'] = [{'name': 'Farokhi, Saeed'}]
          md['description'] = (
              'Ratification Candidate of the World v6.2 Fractal Multi-Brain Architecture. '
              'Status: non-canonical, not deployed, with E2 local component/contract evidence only. '
              'This release is PUBLIC / SOURCE-AVAILABLE / NON-COMMERCIAL. '
              'Original software is licensed under the PolyForm Noncommercial License 1.0.0; '
              'original documentation and architecture are licensed under CC BY-NC-SA 4.0. '
              'Commercial use requires a separate written license from Saeed Farokhi.'
          )
          md['access_right'] = 'open'
          md['version'] = '6.2.0-rc.3'
          md['keywords'] = [
              'multi-agent systems', 'fractal architecture', 'multi-brain architecture',
              'deterministic kernel', 'resolution-native architecture', 'AI orchestration',
              'agent governance', 'source-available', 'non-commercial'
          ]
          md['notes'] = (
              'License map: software — PolyForm Noncommercial License 1.0.0; '
              'documentation/architecture — CC BY-NC-SA 4.0. '
              'Commercial use requires a separate written license. '
              'This RC3 is a Ratification Candidate, NON-CANONICAL, NOT DEPLOYED. '
              'Exact release ZIP SHA-256: '
              '44c47e7d37ba7f6d34a8439ee0917b5b328c23cfbdb53b4cb917402e5869ea4b.'
          )
          md['related_identifiers'] = [
              {'identifier': 'https://github.com/saeedfaai/World-v6-public', 'relation': 'isSupplementTo'},
              {'identifier': 'https://github.com/saeedfaai/World-v6-public/releases/tag/v6.2.0-rc.3', 'relation': 'isSupplementTo'},
          ]

          if not md.get('license'):
              try:
                  lr = requests.get(f'{BASE}/licenses', params={'q':'PolyForm Noncommercial License 1.0.0','size':100}, timeout=30)
                  if lr.ok:
                      data = lr.json()
                      items = data.get('hits', {}).get('hits', []) if isinstance(data, dict) else data
                      for item in items or []:
                          title = (item.get('title') or item.get('name') or item.get('metadata', {}).get('title') or '')
                          if 'PolyForm Noncommercial' in title:
                              lid = item.get('id') or item.get('metadata', {}).get('id')
                              if lid:
                                  md['license'] = lid
                                  break
              except Exception:
                  pass

          if not md.get('license'):
              fail('No license is currently exposed on the draft. Add PolyForm Noncommercial License 1.0.0 in the Zenodo UI, then rerun.')

          r = requests.put(
              f'{BASE}/deposit/depositions/{dep_id}',
              headers=headers,
              data=json.dumps({'metadata': md}),
              timeout=30,
          )
          if not r.ok:
              fail('Zenodo rejected the metadata update', r)

          updated = r.json()
          umd = updated.get('metadata') or {}
          required = {
              'upload_type': 'software', 'publication_date': '2026-08-21',
              'title': TARGET_TITLE, 'access_right': 'open', 'version': '6.2.0-rc.3'
          }
          bad = {k:(umd.get(k),v) for k,v in required.items() if umd.get(k) != v}
          if bad:
              fail('Post-update verification mismatch: ' + json.dumps(bad, ensure_ascii=False))
          if not umd.get('creators') or not umd.get('description') or not umd.get('license'):
              fail('Post-update verification: one or more required fields are missing')

          print('ZENODO_DRAFT_UPDATE=SUCCESS')
          print('TITLE=' + umd.get('title',''))
          print('VERSION=' + umd.get('version',''))
          print('RESOURCE_TYPE=' + umd.get('upload_type',''))
          print('ACCESS=' + umd.get('access_right',''))
          print('LICENSE=' + str(umd.get('license','')))
          print('CREATOR=' + str((umd.get('creators') or [{}])[0].get('name','')))
          print('FILE_MATCH=' + ('yes' if TARGET_FILE in filenames(updated) else 'unknown'))
          print('NEXT=Review mixed licenses in Zenodo UI, then Publish')
          PY
