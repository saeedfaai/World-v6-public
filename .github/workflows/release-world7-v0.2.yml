name: Publish World 7 v0.2 RC1 Release

on:
  push:
    branches:
      - release/world7-v0.2-rc1

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/release/world7-v0.2-rc1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release snapshot
        uses: actions/checkout@v4

      - name: Build public World 7 core snapshot
        run: |
          mkdir -p publication-artifact
          cp .zenodo.json publication-artifact/
          cp CITATION.cff publication-artifact/
          cp WORLD7_RELEASE_NOTES_v0.2.md publication-artifact/
          cp -R world7 publication-artifact/world7
          python - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('publication-artifact')
          rows = []
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  rows.append(f"{h}  {p.relative_to(root).as_posix()}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
          (cd publication-artifact && zip -r ../World_7_v0.2_RC1_public_snapshot.zip .)
          sha256sum World_7_v0.2_RC1_public_snapshot.zip > World_7_v0.2_RC1_public_snapshot.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v7.0.0-rc.1 >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v7.0.0-rc.1 \
            --target "$GITHUB_SHA" \
            --title "World 7 v0.2 — Living Genome Architecture for Persistent Digital Organisms" \
            --notes-file WORLD7_RELEASE_NOTES_v0.2.md \
            World_7_v0.2_RC1_public_snapshot.zip \
            World_7_v0.2_RC1_public_snapshot.zip.sha256
