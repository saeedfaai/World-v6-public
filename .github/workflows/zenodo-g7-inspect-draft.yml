name: Fill and verify Zenodo G7 draft

on:
  push:
    branches: [main]
    paths:
      - .zenodo-g7-inspect-trigger
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - name: Fill exact Zenodo draft safely
        shell: bash
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, requests

          token = os.environ.get('ZENODO_TOKEN', '')
          dep_id = '22040348'
          target_file = 'World_v6.2_RC3_FINAL_RELEASE.zip'
          target_size = 8005594
          out = '/tmp/zenodo-fill.md'
          lines = ['Zenodo G7 fill + verify result (no token exposed).', '']

          def finish():
              open(out, 'w').write('\n'.join(lines))

          if not token:
              lines.append('- Result: `MISSING_SECRET`')
              finish(); raise SystemExit(0)

          h = {'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}
          jh = dict(h); jh['Content-Type'] = 'application/json'

          r = requests.get('https://zenodo.org/api/deposit/depositions/' + dep_id, headers=h, timeout=30)
          lines.append('- Read draft HTTP: `%s`' % r.status_code)
          if not r.ok:
              lines.append('- Result: `READ_FAILED`')
              finish(); raise SystemExit(0)

          d = r.json()
          matched = False
          for f in d.get('files') or []:
              name = f.get('filename') or f.get('key')
              size = f.get('filesize') or f.get('size')
              if name == target_file and (size is None or int(size) == target_size):
                  matched = True
          if (not matched) or d.get('submitted'):
              lines += ['- Result: `SAFETY_STOP`', '- File matched: `%s`' % matched, '- Submitted: `%s`' % d.get('submitted')]
              finish(); raise SystemExit(0)

          lic_id = None
          lr = requests.get('https://zenodo.org/api/licenses/', params={'q':'PolyForm Noncommercial','size':100}, timeout=30)
          lines.append('- License search HTTP: `%s`' % lr.status_code)
          if lr.ok:
              data = lr.json()
              items = data.get('hits', {}).get('hits', []) if isinstance(data, dict) else data
              for item in items or []:
                  lm = item.get('metadata') or item
                  iid = lm.get('id') or item.get('id') or ''
                  title = lm.get('title') or item.get('title') or ''
                  combined = (str(iid) + ' ' + str(title)).lower()
                  if 'polyform' in combined and 'noncommercial' in combined:
                      lic_id = iid
                      break
          if not lic_id:
              for candidate in ['PolyForm-Noncommercial-1.0.0', 'polyform-noncommercial-1.0.0']:
                  tr = requests.get('https://zenodo.org/api/licenses/' + candidate, timeout=30)
                  if tr.ok:
                      tj = tr.json(); tm = tj.get('metadata') or tj
                      lic_id = tm.get('id') or tj.get('id') or candidate
                      break
          if not lic_id:
              lines.append('- Result: `POLYFORM_LICENSE_NOT_FOUND`')
              finish(); raise SystemExit(0)

          md = dict(d.get('metadata') or {})
          md['upload_type'] = 'software'
          md['publication_date'] = '2026-08-21'
          md['title'] = 'World v6.2 — Fractal Multi-Brain Architecture'
          md['creators'] = [{'name':'Farokhi, Saeed'}]
          md['description'] = (
              '<p>Ratification Candidate of the World v6.2 Fractal Multi-Brain Architecture. '
              'Status: NON-CANONICAL, NOT DEPLOYED, with E2 local component/contract evidence only.</p>'
              '<p>PUBLIC / SOURCE-AVAILABLE / NON-COMMERCIAL. Original software is licensed under '
              'PolyForm Noncommercial License 1.0.0. Original documentation and architecture are licensed '
              'under CC BY-NC-SA 4.0. Commercial use requires a separate written license from Saeed Farokhi.</p>'
              '<p>Exact release ZIP SHA-256: 44c47e7d37ba7f6d34a8439ee0917b5b328c23cfbdb53b4cb917402e5869ea4b.</p>'
          )
          md['access_right'] = 'open'
          md['license'] = lic_id
          md['version'] = '6.2.0-rc.3'
          md['keywords'] = [
              'multi-agent systems','fractal architecture','multi-brain architecture','deterministic kernel',
              'resolution-native architecture','AI orchestration','agent governance','source-available','non-commercial'
          ]
          md['notes'] = (
              'Mixed-license release. Software: PolyForm Noncommercial License 1.0.0. '
              'Documentation/architecture: CC BY-NC-SA 4.0. Commercial use requires a separate written license. '
              'RC3 is a Ratification Candidate, NON-CANONICAL, NOT DEPLOYED. '
              'Exact release ZIP SHA-256: 44c47e7d37ba7f6d34a8439ee0917b5b328c23cfbdb53b4cb917402e5869ea4b.'
          )
          md['related_identifiers'] = [
              {'identifier':'https://github.com/saeedfaai/World-v6-public','relation':'isSupplementTo','scheme':'url'},
              {'identifier':'https://github.com/saeedfaai/World-v6-public/releases/tag/v6.2.0-rc.3','relation':'isSupplementTo','scheme':'url'}
          ]

          u = requests.put(
              'https://zenodo.org/api/deposit/depositions/' + dep_id,
              headers=jh,
              data=json.dumps({'metadata': md}),
              timeout=30
          )
          lines += ['- Update HTTP: `%s`' % u.status_code, '- PolyForm license id: `%s`' % lic_id]
          if not u.ok:
              lines.append('- Result: `UPDATE_FAILED`')
              try:
                  ej = u.json()
                  lines.append('- Message: `%s`' % ej.get('message',''))
                  lines.append('- Errors: `%s`' % json.dumps(ej.get('errors'), ensure_ascii=False))
              except Exception:
                  lines.append('- Body: `%s`' % u.text[:800])
              finish(); raise SystemExit(0)

          vr = requests.get('https://zenodo.org/api/deposit/depositions/' + dep_id, headers=h, timeout=30)
          vm = (vr.json().get('metadata') or {}) if vr.ok else {}
          checks = {
              'title': vm.get('title') == 'World v6.2 — Fractal Multi-Brain Architecture',
              'resource_type': vm.get('upload_type') == 'software',
              'creator': bool(vm.get('creators')),
              'version': vm.get('version') == '6.2.0-rc.3',
              'description': bool(vm.get('description')),
              'access': vm.get('access_right') == 'open',
              'license': vm.get('license') == lic_id,
              'keywords': len(vm.get('keywords') or []) >= 5,
              'links': len(vm.get('related_identifiers') or []) == 2,
          }
          result = 'SUCCESS' if all(checks.values()) else 'VERIFY_FAILED'
          lines += [
              '- Verify HTTP: `%s`' % vr.status_code,
              '- Result: `%s`' % result,
              '- Checks: `%s`' % json.dumps(checks, ensure_ascii=False),
              '- Final title: `%s`' % vm.get('title'),
              '- Final type: `%s`' % vm.get('upload_type'),
              '- Final version: `%s`' % vm.get('version'),
              '- Final license: `%s`' % vm.get('license'),
          ]
          finish()
          PY

      - name: Report fill result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f /tmp/zenodo-fill.md || printf '%s\n' 'Zenodo fill script failed before producing a report.' > /tmp/zenodo-fill.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Zenodo G7 fill verify - ${GITHUB_RUN_ID}" --body-file /tmp/zenodo-fill.md
