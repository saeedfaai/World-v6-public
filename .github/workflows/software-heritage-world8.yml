name: Archive World 8 Z0-A in Software Heritage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/software-heritage-world8.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORIGIN_URL: https://github.com/saeedfaai/World-v6-public
      TARGET_COMMIT: 7a0311bc25668ea00da873a1663a99898eaa7329
      TARGET_BRANCH: archive/world8-z0a-2026-08-24
      TARGET_PATH: world8-z0a
      ZENODO_DOI: 10.5281/zenodo.22085394
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate archival baseline and metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}:${TARGET_BRANCH}"
          actual="$(git rev-parse "${TARGET_BRANCH}")"
          test "$actual" = "$TARGET_COMMIT" || {
            echo "Frozen branch moved: expected $TARGET_COMMIT got $actual" >&2
            exit 10
          }
          for f in \
            "$TARGET_PATH/README.md" \
            "$TARGET_PATH/AUTHORS" \
            "$TARGET_PATH/LICENSE" \
            "$TARGET_PATH/CITATION.cff" \
            "$TARGET_PATH/codemeta.json" \
            "$TARGET_PATH/PROVENANCE.md" \
            "$TARGET_PATH/MANIFEST.json" \
            "$TARGET_PATH/SHA256SUMS.txt"; do
            git cat-file -e "$TARGET_COMMIT:$f"
            echo "FOUND=$f"
          done
          test "$(git show "$TARGET_COMMIT:$TARGET_PATH/LICENSE" | grep -c 'CC-BY-NC-ND-4.0')" -ge 1
          test "$(git show "$TARGET_COMMIT:$TARGET_PATH/CITATION.cff" | grep -c "$ZENODO_DOI")" -ge 1
          mkdir -p ops/software-heritage/world8

      - name: Request Software Heritage Save Code Now
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          origin = os.environ['ORIGIN_URL']
          qs = urllib.parse.urlencode({'visit_type':'git','origin_url':origin})
          url = 'https://archive.softwareheritage.org/api/1/origin/save/?' + qs
          req = urllib.request.Request(
              url,
              method='POST',
              headers={
                  'Accept':'application/json',
                  'User-Agent':'World8-Z0A-Archival-Workflow/1.0 (+https://github.com/saeedfaai/World-v6-public)'
              }
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  status = r.status
                  body = r.read().decode('utf-8')
          except urllib.error.HTTPError as e:
              status = e.code
              body = e.read().decode('utf-8', errors='replace')
          print('SWH_HTTP_STATUS=' + str(status))
          print(body)
          try:
              data = json.loads(body)
          except Exception:
              data = {'raw': body}
          out = {
              'request_http_status': status,
              'request_response': data,
          }
          open('ops/software-heritage/world8/save-request.json','w',encoding='utf-8').write(
              json.dumps(out, ensure_ascii=False, indent=2)
          )
          if status not in (200, 201):
              sys.exit(20)
          rid = data.get('id')
          if not rid:
              print('Software Heritage response has no request id', file=sys.stderr)
              sys.exit(21)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('request_id=' + str(rid) + '\n')
          PY

      - name: Poll archival task and derive persistent identifiers
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, subprocess, time, urllib.parse, urllib.request, urllib.error

          origin = os.environ['ORIGIN_URL']
          rid = os.environ['REQUEST_ID']
          commit = os.environ['TARGET_COMMIT']
          path = os.environ['TARGET_PATH']
          branch = os.environ['TARGET_BRANCH']
          tree = subprocess.check_output(
              ['git','rev-parse',f'{commit}:{path}'], text=True
          ).strip()

          def get_json(url, timeout=60):
              req = urllib.request.Request(url, headers={
                  'Accept':'application/json',
                  'User-Agent':'World8-Z0A-Archival-Workflow/1.0 (+https://github.com/saeedfaai/World-v6-public)'
              })
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8', errors='replace')
                  try: obj = json.loads(raw)
                  except Exception: obj = {'raw':raw}
                  return e.code, obj

          status_url = f'https://archive.softwareheritage.org/api/1/origin/save/{rid}/'
          last = None
          for attempt in range(48):
              code, data = get_json(status_url)
              last = {'http_status':code, 'response':data, 'attempt':attempt+1}
              task = (data or {}).get('save_task_status') if isinstance(data,dict) else None
              reqstatus = (data or {}).get('save_request_status') if isinstance(data,dict) else None
              print(f'POLL={attempt+1} request={reqstatus} task={task}')
              if reqstatus == 'rejected' or task == 'failed':
                  break
              if task == 'succeeded':
                  break
              time.sleep(15)

          data = last['response'] if isinstance(last,dict) else {}
          task = data.get('save_task_status') if isinstance(data,dict) else None
          snapshot_swhid = data.get('snapshot_swhid') if isinstance(data,dict) else None
          visit_date = data.get('visit_date') if isinstance(data,dict) else None

          revision_swhid = 'swh:1:rev:' + commit
          directory_swhid = 'swh:1:dir:' + tree

          rev_code, rev_obj = get_json('https://archive.softwareheritage.org/api/1/revision/' + commit + '/')
          dir_code, dir_obj = get_json('https://archive.softwareheritage.org/api/1/directory/' + tree + '/')

          qualified_dir = (
              directory_swhid +
              ';origin=' + urllib.parse.quote(origin, safe=':/') +
              ';anchor=' + revision_swhid +
              ';path=/' + path
          )

          receipt = {
              'checked_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'origin_url': origin,
              'software_heritage_save_request_id': int(rid),
              'save_request_status': data.get('save_request_status') if isinstance(data,dict) else None,
              'save_task_status': task,
              'visit_date': visit_date,
              'visit_status': data.get('visit_status') if isinstance(data,dict) else None,
              'snapshot_swhid': snapshot_swhid,
              'frozen_branch': branch,
              'git_revision': commit,
              'revision_swhid': revision_swhid,
              'world8_tree_git_sha1': tree,
              'directory_swhid': directory_swhid,
              'qualified_directory_swhid': qualified_dir,
              'revision_api_http_status': rev_code,
              'directory_api_http_status': dir_code,
              'revision_archived': rev_code == 200,
              'directory_archived': dir_code == 200,
              'zenodo_doi': os.environ['ZENODO_DOI'],
              'claim_boundary': 'FINAL DESIGN BASELINE / NOT PRODUCTION',
              'request_status_url': status_url,
              'archive_browse_revision': 'https://archive.softwareheritage.org/' + revision_swhid + '/',
              'archive_browse_directory': 'https://archive.softwareheritage.org/' + directory_swhid + '/',
              'result': 'SUCCEEDED' if task == 'succeeded' and rev_code == 200 and dir_code == 200 else 'REQUESTED_OR_PROCESSING'
          }
          open('ops/software-heritage/world8/receipt.json','w',encoding='utf-8').write(
              json.dumps(receipt,ensure_ascii=False,indent=2)
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))

          if data.get('save_request_status') == 'rejected' or task == 'failed':
              raise SystemExit(30)
          # A successfully accepted request may still be processing after the polling window.
          # Preserve that state as a valid archival request instead of fabricating completion.
          PY

      - name: Commit Software Heritage archival receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          git add ops/software-heritage/world8/save-request.json ops/software-heritage/world8/receipt.json
          if git diff --cached --quiet; then
            echo 'No Software Heritage receipt changes to commit.'
          else
            git commit -m 'Record World 8 Software Heritage archival receipt [skip ci]'
            git push origin main
          fi
